<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sneat Games">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- game controller -->
  <g fill="#ffffff">
    <rect x="12" y="26" width="40" height="20" rx="10"/>
    <!-- d-pad -->
    <rect x="19" y="33" width="10" height="3.2" rx="1.6" fill="#7c3aed"/>
    <rect x="22.4" y="29.6" width="3.2" height="10" rx="1.6" fill="#7c3aed"/>
    <!-- buttons -->
    <circle cx="40" cy="33.5" r="2.6" fill="#7c3aed"/>
    <circle cx="45.5" cy="38.5" r="2.6" fill="#7c3aed"/>
  </g>
</svg>

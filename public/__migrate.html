<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moving to sneat.games…</title>
<style>
  html { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; }
</style>
</head>
<body>
<p>Moving your game to <a id="go" href="https://sneat.games/">sneat.games</a>…</p>
<script>
// Hand-over from a retired <game>.sneat.games host to https://sneat.games/<slug>/.
//
// Reached on an OLD host only: the zone redirect sends every other path there
// to the new home but passes this page (and the /sw.js kill switch that
// navigates here) through. Steps:
//   1. read the allowlisted localStorage keys of this origin
//   2. unregister every service worker of this origin and clear its caches,
//      so the next visit takes the plain redirect
//   3. location.replace(https://sneat.games/<slug>/#migrate=<b64url(JSON)>)
//      keeping any other fragment params (an invite's `room=`); fragments
//      never reach a server
// The game imports the keys once (game-kit consumeMigratedStorage(): only
// allowlisted keys, never over a save made on the new origin) and strips
// `migrate=` from the URL. On the apex, or on an unknown host, it just goes
// to the landing / the game without reading anything.
(function () {
  "use strict";
  var APEX = "https://sneat.games";
  // Old host label == path slug (founder decision D1, 2026-10-16).
  var SLUGS = ["bidding-tictactoe", "dots-and-boxes", "domineering", "four-in-a-row", "gomoku",
    "greed", "hex", "reversi", "ultimate-tictactoe", "y"];
  // Keep in step with LEGACY_STORAGE_KEYS in @sneat/game-kit src/storage/storage.ts.
  var LEGACY_KEYS = ["sneat-games-theme",
    "ultimate-tictactoe:standings:vs-bot", "four-in-a-row:standings:vs-bot", "gomoku:standings:vs-bot",
    "y:standings:vs-bot", "reversi:standings:vs-bot", "greed-game:standings:vs-bot", "hex:standings:vs-bot",
    "dnb-stats-v1", "dom-stats-v1"];

  var host = location.hostname.toLowerCase();
  var suffix = ".sneat.games";
  var label = host.length > suffix.length && host.slice(-suffix.length) === suffix
    ? host.slice(0, -suffix.length) : "";
  var slug = SLUGS.indexOf(label) >= 0 ? label : "";

  var saves = {};
  var count = 0;
  if (slug) {
    for (var i = 0; i < LEGACY_KEYS.length; i++) {
      try {
        var v = localStorage.getItem(LEGACY_KEYS[i]);
        if (v !== null) { saves[LEGACY_KEYS[i]] = v; count++; }
      } catch (e) { /* storage blocked: nothing to hand over */ }
    }
  }

  function b64url(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  var params = new URLSearchParams(location.hash.replace(/^#/, ""));
  params.delete("migrate");
  if (count) params.set("migrate", b64url(JSON.stringify(saves)));
  var frag = params.toString();
  var target = APEX + "/" + (slug ? slug + "/" : "") + (frag ? "#" + frag : "");
  document.getElementById("go").href = target;

  function cleanup() {
    var jobs = [];
    if ("serviceWorker" in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (typeof caches !== "undefined") {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }));
    }
    return Promise.all(jobs);
  }

  var gone = false;
  function go() { if (!gone) { gone = true; location.replace(target); } }
  // Never strand the player here: leave after 3 s even if cleanup hangs.
  setTimeout(go, 3000);
  cleanup().then(go, go);
})();
</script>
</body>
</html>

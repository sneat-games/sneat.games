name: CI

# PR gate for the landing: lint, the games-lock extractor tests, and the
# full build (which downloads and verifies every pinned game asset). Deploy
# stays in deploy.yml (push to main). Same pnpm/Node setup as cf-deploy.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm + Node
        uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Test (games-lock extractor)
        run: pnpm test

      # Same App token as deploy.yml (cf-deploy's build-github-app-*): the
      # build downloads release assets of the 7 PRIVATE game repos.
      - name: GitHub App token for the private game repos
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23li26w131Kv6u3IdM
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
          owner: sneat-games
          repositories: dots-and-boxes,domineering,four-in-a-row,gomoku,hex,ultimate-tictactoe,y-game

      - name: Build (verifies pinned game assets)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: pnpm build

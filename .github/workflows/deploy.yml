name: Deploy landing (Cloudflare)

# Deploys the sneat.games landing (Astro static site) to Cloudflare Workers
# static assets via the shared reusable cf-deploy workflow, so every Sneat site
# deploys the same way and every deploy is auditable in GitHub Actions.
#
# Auth is org-level: a CLOUDFLARE_API_TOKEN org secret + a CLOUDFLARE_ACCOUNT_ID
# org variable (an identifier, not a secret). These must exist on the
# sneat-games org, and the org's Actions policy must allow calling reusable
# workflows from sneat-co/cicd.
#
# Deploys on every push to main, plus manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
    with:
      working-directory: .
      # PUBLIC_SITE_URL feeds astro.config's canonical/OG/sitemap host. When the
      # repo variable is unset it falls back to the https://sneat.games default
      # baked into astro.config.mjs.
      build-command: PUBLIC_SITE_URL='${{ vars.PUBLIC_SITE_URL }}' pnpm build
      # The build downloads each game's pinned release asset
      # (scripts/games-lock.mjs) with GH_TOKEN. 7 game repos are PRIVATE, so
      # the job's own GITHUB_TOKEN is not enough: cf-deploy mints a token of
      # the sneat-releaser GitHub App (owner sneat-dev, also used by
      # datatug/datatug-apps), scoped to exactly the private game repos.
      # Needs: the App installed on the sneat-games org with Contents: read on
      # these repos, and the org secret SNEAT_RELEASER_PRIVATE_KEY.
      build-github-app-client-id: Iv23li26w131Kv6u3IdM
      build-github-app-owner: sneat-games
      build-github-app-repositories: dots-and-boxes,domineering,four-in-a-row,gomoku,hex,ultimate-tictactoe,y-game
      wrangler-config: wrangler.jsonc
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      BUILD_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
